run:
  timeout: 5m
  concurrency: 4
  modules-download-mode: readonly
  go: "1.27"

output:
  formats:
    - format: colored-line-number
  sort-results: true

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
  revive:
    confidence: 0.8
    rules:
      - name: exported
        arguments:
          - checkPrivateReceivers
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
  gosec:
    excludes:
      - G104
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/chishkin-afk/wehicle/backend
  unparam:
    check-exported: false
  prealloc:
    simple: true
    range-loops: true
  tagalign:
    align: true
    sort: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - gocritic
    - gosec
    - unconvert
    - unparam
    - prealloc
    - bodyclose
    - noctx
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - copyloopvar
    - mirror
    - misspell
    - whitespace
    - tagalign
    - perfsprint

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - unparam
        - noctx
    - path: _test\.go
      text: "should have a package comment"
      linters:
        - revive
  max-issues-per-linter: 0
  max-same-issues: 0